[workspace]
members = [
  ".",
  "dnsproxymanager",
]

[package]
name = "dnsproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
env_logger = "0.11.11"
log = "0.4.34"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary"] }
objc2-network-extension = { version = "0.3.2", features = ["block2"] }
