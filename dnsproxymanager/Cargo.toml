[package]
name = "dnsproxymanager"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6.2"
clap = { version = "4.6.7", features = ["derive"] }
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary"] }
objc2-system-extensions = "0.3.2"
objc2-network-extension = { version = "0.3.2", features = ["block2"] }
env_logger = "0.11.11"
log = "0.4.34"
